<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('portfolio-theme'); } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#171918' : '#ffffff';
      })();
    </script>
    <meta name="description" content="Portfolio of Tim Wong, a full stack software engineer building reliable products across frontend, backend, data, and infrastructure." />
    <meta property="og:title" content="Tim Wong | Full Stack Software Engineer" />
    <meta property="og:description" content="Full stack software engineer building reliable products across frontend, backend, data, and infrastructure." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tim Wong | Full Stack Software Engineer" />
    <meta name="twitter:description" content="Full stack software engineer building reliable products across frontend, backend, data, and infrastructure." />
    <title>Tim Wong | Full Stack Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
